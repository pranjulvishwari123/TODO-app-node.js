
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tasks | To-Do App</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="app-header">
            <div>
                <h1>My Tasks ✨</h1>
                <p>Organize your day, one task at a time.</p>
            </div>

            <button id="themeToggle" class="theme-toggle">
                🌙 Dark Mode
            </button>
        </header>

        <!-- Dashboard Statistics -->
        <section class="stats">

            <div class="stat-card total-card">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card completed-card">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-card pending-card">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>

        </section>

        <!-- Add Task -->
        <section class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >

            <button id="addBtn">+ Add Task</button>

        </section>

        <!-- Task Filters -->
        <section class="filters">

            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="pending">
                Pending
            </button>

            <button class="filter" data-filter="completed">
                Completed
            </button>

        </section>

        <!-- Task List -->
        <section class="task-section">

            <h3>My Task List</h3>

            <ul id="taskList"></ul>

            <p id="emptyMessage">
                No tasks yet. Add your first task!
            </p>

        </section>

        <footer>
            Made By <b>PRANJUL VISHWARI</b> using Node.js
        </footer>

    </div>

    <script src="/script.js"></script>

</body>
</html>
